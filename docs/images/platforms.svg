<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">RAtouch platform comparison</title><desc id="desc">macOS uses pointer and keyboard controls. iPadOS uses direct touch and an accessible command palette. Both run the same faithful simulation with user-supplied data.</desc>
  <defs><style>.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4ead7}.head{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4ead7}.body{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9b5ae}.tag{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#ff4a3d}</style></defs>
  <rect width="1200" height="390" rx="30" fill="#0b0c0e"/><text x="42" y="58" class="title">One simulation. Two native control surfaces.</text>
  <g transform="translate(42 98)"><rect width="535" height="250" rx="22" fill="#15171a" stroke="#303238"/><text x="28" y="42" class="tag">macOS</text><text x="28" y="82" class="head">Pointer precision</text><text x="28" y="119" class="body">Mouse and trackpad, original hotkeys,</text><text x="28" y="148" class="body">resizable window, and fullscreen.</text><path d="M408 61l-1 104 27-25 18 42 20-9-18-41 37-2z" fill="#f4ead7" stroke="#0b0c0e" stroke-width="5" stroke-linejoin="round"/><rect x="28" y="184" width="188" height="38" rx="19" fill="#22252a"/><text x="122" y="209" class="body" text-anchor="middle">Keyboard complete</text></g>
  <g transform="translate(623 98)"><rect width="535" height="250" rx="22" fill="#15171a" stroke="#5c2926"/><text x="28" y="42" class="tag">iPadOS</text><text x="28" y="82" class="head">Direct command</text><text x="28" y="119" class="body">Tap, drag, long press, two-finger pan,</text><text x="28" y="148" class="body">pinch, control groups, and command deck.</text><circle cx="433" cy="116" r="50" fill="none" stroke="#ff3b30" stroke-width="3"/><circle cx="433" cy="116" r="18" fill="#ff3b30"/><rect x="28" y="184" width="238" height="38" rx="19" fill="#3a1d1b"/><text x="147" y="209" class="body" text-anchor="middle">Touch + keyboard / pointer</text></g>
</svg>
